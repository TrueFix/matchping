name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./scripts/icon
      - run: git diff --exit-code -- build/appicon.png build/windows/icon.ico build/linux/matchping.png
      - run: python3 scripts/release.py validate --tag "v$(cat VERSION)"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y iputils-ping
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
